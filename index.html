<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Showcase - Web Designer Challenge</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header / Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <h2>TechStore</h2>
    </div>

    <nav class="nav-links">
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#about">About Us</a>
    </nav>

    <div class="search-bar">
      <input type="text" placeholder="Search products...">
      <button type="button">Search</button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container">
    
    <!-- Main Title -->
    <h1 class="main-title">Featured Product</h1>

    <!-- Product Showcase Card -->
    <section class="product-card">
      
      <!-- Product 1 -->
      <article class="product-card">
        <div class="product-image">
          <img src="img/audiculares.jpg" alt="Wireless Headphones">
        </div>
        <div class="product-details">
          <h2 class="product-name">Wireless Headphones</h2>
          <p class="product-description">
            High-quality wireless headphones with active noise cancellation and 30-hour battery.
          </p>
          <p class="price">$99.99</p>
          <button class="buy-btn">Buy Now</button>
        </div>
      </article>

    </section>

  </main>

  <!-- Footer & Contact Information -->
  <footer class="site-footer">
    <div class="contact-info">
      <h3>Contact Us</h3>
      <p>Email: support@techstore.com | Phone: +1 234 567 890</p>
    </div>
    <p class="copyright">&copy; 2026 TechStore. All rights reserved.</p>
  </footer>

</body>
</html>
